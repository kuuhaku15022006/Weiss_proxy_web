<!DOCTYPE html>
<html lang="VI">
<head>
<link rel="stylesheet" href="proxy.css">
<meta charset="UTF-8">
<title>Proxy Maker</title>
</head>
<body>
  <h2>Nhập danh sách card code</h2>
  <textarea id="nameList" rows="10" cols="40" placeholder="
HƯỚNG DẪN SỬ DỤNG:
-DÁN CARD CODE VÀO + SỐ LƯỢNG 
-VÍ DỤ:
DCT_S86_001 X3
DCT_S86_002 
DCT_S86_004 X2
-CÁCH LẤY CARD CODE:
TÌM TRÊN BẤT KỲ TRANG NÀO MÀ AE XEM CARD (NHƯ LÀ ENCORE DECK,...)

LƯU Ý: TRONG THỜI GIAN SỬ DỤNG, NẾU THẤY THIẾU MỘT SỐ CARD/SERIES NÀO HOẶC MUỐN TIẾNG ANH
THÌ NHẮN EM ĐỂ EM TÌM THỬ RỒI UP LÊN SAU
"></textarea>

  <h2>Xuất file</h2>
  <button id="exportPdfBtn">Xuất PDF</button>

  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
  <script src="https://unpkg.com/docx@8/build/index.js"></script>
  <script src="proxy.js"></script>
